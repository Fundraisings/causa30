<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Causa30</title>

  <meta
    name="description"
    content="Historias reales. Valores que transforman. Una causa que nos une."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #12332A;
      color: #F8F5EF;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .welcome {
      width: 100%;
      max-width: 520px;
    }

    .brand {
      display: inline-block;
      margin-bottom: 48px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    .eyebrow {
      margin-bottom: 18px;
      color: #E8664A;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    h1 {
      max-width: 460px;
      font-size: clamp(44px, 12vw, 72px);
      line-height: 0.96;
      letter-spacing: -0.05em;
    }

    p {
      max-width: 410px;
      margin-top: 28px;
      color: rgba(248, 245, 239, 0.76);
      font-size: 18px;
      line-height: 1.6;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 52px;
      font-size: 13px;
      color: rgba(248, 245, 239, 0.58);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #E8664A;
    }
  </style>
</head>

<body>

  <main>
    <section class="welcome">

      <span class="brand">CAUSA30</span>

      <div class="eyebrow">ESTAMOS CONSTRUYENDO ALGO NUEVO</div>

      <h1>
        Historias reales.<br>
        Valores que transforman.
      </h1>

      <p>
        Una nueva forma de vivir historias, convertirlas en acción
        y ayudar a quienes no tienen voz.
      </p>

      <div class="status">
        <span class="dot"></span>
        <span>Nueva experiencia en desarrollo</span>
      </div>

    </section>
  </main>

</body>
</html>
